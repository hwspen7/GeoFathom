name: Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API and test dependencies
        run: python -m pip install -c requirements/linux.lock -e ".[dev,vision]" "onnx>=1.16,<2"
      - name: Build native geometry kernels
        run: |
          cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --config Release --parallel
          ctest --test-dir build/native --build-config Release --output-on-failure
          cmake -S . -B build/native-debug -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/native-debug --config Debug --parallel
          ctest --test-dir build/native-debug --build-config Debug --output-on-failure
      - name: Audit native address/undefined behavior
        run: |
          cmake -S . -B build/native-sanitized -DCMAKE_BUILD_TYPE=Debug -DGEOFATHOM_NATIVE_SANITIZERS=ON
          cmake --build build/native-sanitized --config Debug --parallel
          ctest --test-dir build/native-sanitized --build-config Debug --output-on-failure
      - name: Native thread sanitizer
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          cmake -S . -B build/native-tsan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread -no-pie" -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build/native-tsan --parallel
          TSAN_OPTIONS=halt_on_error=1 ctest --test-dir build/native-tsan --output-on-failure
      - name: Mutation fuzzing under ASan and UBSan
        run: |
          mkdir -p build/fuzz
          clang++ -std=c++17 -g -O1 -fno-omit-frame-pointer -fsanitize=fuzzer,address,undefined geometry/native/fuzz_spectral.cpp geometry/native/spectral.cpp geometry/native/transitions.cpp -o build/fuzz/spectral
          build/fuzz/spectral -runs=20000 -max_len=4096 -timeout=3
      - name: Run Python tests with native library
        env:
          GEOFATHOM_REQUIRE_NATIVE: '1'
          GEOFATHOM_STRESS_8K: '1'
          GEOFATHOM_STRESS_16K: '1'
          GEOFATHOM_STRESS_MILLION_SEGMENTS: '1'
          GEOFATHOM_REQUIRE_REAL_ONNX: '1'
        run: python scripts/run_acceptance.py -q --cov --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=json:coverage.json --junitxml=build/python-junit.xml
      - name: Preserve raw Python coverage data
        run: cp .coverage coverage-data.bin
      - name: Native compute soak and performance smoke gate
        run: python benchmarks/soak.py --seconds 10 --output native-soak.json
      - name: Upload native soak result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-soak
          path: native-soak.json
      - name: Upload code coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geofathom-python-coverage
          path: |
            coverage.xml
            coverage.json
            build/python-junit.xml
            coverage-data.bin
          retention-days: 14

  native-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instrument GCC native CPU kernels
        run: |
          python -m pip install "gcovr>=8,<9"
          cmake -S . -B build/native-coverage -DCMAKE_BUILD_TYPE=Debug -DGEOFATHOM_NATIVE_COVERAGE=ON
          cmake --build build/native-coverage --parallel
          ctest --test-dir build/native-coverage --output-on-failure --no-tests=error
          gcovr --root . --filter geometry/native/ --exclude 'geometry/native/test_.*' --exclude 'geometry/native/fuzz_.*' --xml native-coverage.xml build/native-coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geofathom-native-coverage
          path: native-coverage.xml

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        working-directory: web
        run: npm run build
      - name: Unit test precision editor and survey geometry
        working-directory: web
        run: npm test
      - name: Collect source-instrumented frontend unit coverage
        working-directory: web
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geofathom-web-coverage
          path: web/coverage/


  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GIS API
        run: python -m pip install -c requirements/linux.lock -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web and Playwright test dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Install Chromium and system dependencies
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Verify browser workspace starts with accessible map and navigation
        working-directory: web
        run: npx playwright test e2e/workspace-bootstrap.spec.ts --workers=1
      - name: Complete browser suite with coverage (two workers, no retries)
        working-directory: web
        env:
          GEOFATHOM_E2E_WORKERS: '2'
          GEOFATHOM_E2E_DATABASE_PATH: data/e2e-geofathom-acceptance.sqlite
        run: npm run test:e2e:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: geofathom-browser-coverage
          path: web/coverage/raw/browser/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geofathom-workspace-ui-screenshots
          path: web/test-results/**/survey-*.png
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: geofathom-browser-failure-traces
          path: web/test-results/
          retention-days: 7


  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate local Windows one-click launchers
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/Local-Research.ps1).Path,
            [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-Host
            throw "PowerShell one-click launcher syntax invalid."
          }
          foreach ($launcher in @(
            "Start-GeoFathom.bat",
            "Test-Terrain-Quick.bat",
            "Test-GeoFathom-Full.bat"
          )) {
            if (-not (Test-Path $launcher)) { throw "Missing launcher: $launcher" }
          }
      - name: Execute Windows launcher success and failure contracts
        shell: pwsh
        run: ./scripts/Test-WindowsLaunchers.ps1
      - name: Install Windows GIS and test dependencies
        run: python -m pip install -c requirements/windows.lock -e ".[dev]"
      - name: Compile native C++ kernels with MSVC
        run: |
          cmake -S . -B build/native -A x64
          cmake --build build/native --config Release --parallel
          ctest --test-dir build/native --build-config Release --output-on-failure
      - name: Execute Python tests using Windows DLL
        env:
          GEOFATHOM_REQUIRE_NATIVE: '1'
        run: python scripts/run_acceptance.py -q --cov --cov-branch --cov-report=xml:coverage.xml --cov-report=json:coverage.json --junitxml=build/windows-junit.xml
      - name: Preserve raw Windows coverage data
        run: Copy-Item .coverage coverage-data.bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geofathom-windows-coverage
          path: |
            coverage.xml
            coverage.json
            build/windows-junit.xml
            coverage-data.bin


  postgis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: geofathom
          POSTGRES_PASSWORD: geofathom_ci
          POSTGRES_DB: geofathom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geofathom -d geofathom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      GEOFATHOM_TEST_POSTGIS_DSN: postgresql://geofathom:geofathom_ci@localhost:5432/geofathom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PostGIS integration dependencies
        run: python -m pip install -c requirements/postgis.lock -e ".[dev,postgis]"
      - name: Test real PostGIS sync, GiST indexed query and revision
        run: python scripts/run_acceptance.py -v --cov --cov-branch --cov-report=xml:coverage.xml --cov-report=json:coverage.json --junitxml=postgis-junit.xml tests/test_postgis.py tests/test_distributed.py
      - name: Preserve raw PostGIS coverage data
        run: cp .coverage coverage-data.bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geofathom-postgis-coverage
          path: |
            coverage.xml
            coverage.json
            postgis-junit.xml
            coverage-data.bin


  quality-measurement:
    needs: [python, windows, postgis, native-coverage, web, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: geofathom-*-coverage
          path: reports
      - name: Combine Python line and branch execution across platforms
        run: |
          python -m pip install "coverage==7.17.4"
          python -m coverage combine --keep reports/geofathom-python-coverage/coverage-data.bin reports/geofathom-windows-coverage/coverage-data.bin reports/geofathom-postgis-coverage/coverage-data.bin
          python -m coverage json -o combined-coverage.json
          python -m coverage xml -o combined-coverage.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge unit and browser execution with the same source maps
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          mkdir -p coverage/raw
          cp -R ../reports/geofathom-web-coverage/raw/unit coverage/raw/unit
          cp -R ../reports/geofathom-browser-coverage coverage/raw/browser
          npm run coverage:merge
      - name: Record quality targets without falsely qualifying the release
        run: |
          python scripts/quality_report.py --python combined-coverage.json --native reports/geofathom-native-coverage/native-coverage.xml --web web/coverage/coverage-summary.json --output quality.json --baseline docs/quality-baseline.json --report-only
          cat quality.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: geofathom-combined-quality
          path: |
            combined-coverage.json
            combined-coverage.xml
            quality.json
            web/coverage/coverage-summary.json
            web/coverage/coverage-final.json


  quality-targets:
    # Coverage targets are temporarily advisory by explicit project decision.
    # Keep the measured reports above; remove this condition to enforce again.
    if: ${{ false }}
    needs: [quality-measurement]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: geofathom-*-coverage
          path: reports
      - uses: actions/download-artifact@v4
        with:
          name: geofathom-combined-quality
          path: combined
      - name: Enforce all measured coverage thresholds and regression floors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.quality_report import coverage_gates
          paths=list(Path("combined").rglob("quality.json"))
          if len(paths)!=1:
              raise RuntimeError("Expected exactly one combined coverage report")
          report=json.loads(paths[0].read_text(encoding="utf-8"))
          baseline=json.loads(Path("docs/quality-baseline.json").read_text(encoding="utf-8"))["floors"]
          result=coverage_gates(report,baseline)
          print(json.dumps(result,indent=2))
          if not result["passed"]:
              raise SystemExit("Coverage targets or regression floors are unmet.")
          PY
