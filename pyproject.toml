[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geofathom-api"
version = "0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1", "shapely>=2.0,<3", "pyproj>=3.6,<4",
  "python-dotenv>=1.0,<2", "psutil>=6.0,<9",
  "numpy>=1.26,<3", "numba>=0.65.1,<0.67", "rasterio>=1.4,<2", "Pillow>=10,<13",
  "python-multipart>=0.0.9,<1", "pyogrio>=0.12,<1",
  "reportlab>=4.2,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=7,<8", "coverage>=7.10.6,<8", "pypdf>=5,<8"]
postgis = ["psycopg[binary]>=3.2,<4"]
vision = ["onnxruntime>=1.18,<2"]

[tool.setuptools.packages.find]
include = ["core*", "geometry*", "places*", "intelligence*", "analysis*", "storage*", "imagery*", "vision*", "terrain*", "cartography*", "services*", "jobs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"


[tool.coverage.run]
branch = true
parallel = true
relative_files = true
concurrency = ["thread", "multiprocessing"]
patch = ["subprocess"]
source = ["geometry", "storage", "terrain", "vision", "jobs", "core", "imagery", "analysis", "services", "places", "intelligence", "cartography"]

[tool.coverage.report]
show_missing = true
precision = 2


[tool.coverage.paths]
source = [".", "*/GeoFathom", '*\GeoFathom']

[tool.setuptools.package-data]
terrain = ["fonts/*.ttf", "fonts/*.txt"]
