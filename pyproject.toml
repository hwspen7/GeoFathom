[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geofathom-api"
version = "0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1", "shapely>=2.0,<3", "pyproj>=3.6,<4",
  "python-dotenv>=1.0,<2",
  "numpy>=1.26,<3", "rasterio>=1.4,<2", "Pillow>=10,<13",
  "python-multipart>=0.0.9,<1", "pyogrio>=0.12,<1",
  "reportlab>=4.2,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=5,<8", "pypdf>=5,<8"]
postgis = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
include = ["core*", "geometry*", "places*", "intelligence*", "analysis*", "storage*", "imagery*", "vision*", "terrain*", "cartography*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
