name: Terrain scientific reference gate

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  independent-gdal:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent GDAL command-line reference
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdal-bin
          gdalinfo --version
      - name: Install GeoFathom numerical dependencies
        run: python -m pip install -c requirements/linux.lock -e ".[dev]"
      - name: Install independent PySheds D-infinity reference
        run: python -m pip install "pysheds==0.5"
      - name: Run independent GDAL cross-implementation comparisons
        run: |
          mkdir -p build
          python benchmarks/terrain_reference.py --strict --output build/terrain-reference.json
      - name: Test foundational scientific invariants and edge cases
        run: |
          python -m pytest -q --junitxml=build/terrain-foundation-tests.xml tests/test_terrain_operation_matrix.py tests/test_terrain_numerical_gate.py tests/test_terrain_projection_validation.py tests/test_terrain_scope_validation.py tests/test_terrain_scientific_invariants.py tests/test_terrain_professional.py tests/test_terrain_conditioning.py tests/test_terrain_gradient_unification.py tests/test_terrain_catalog.py
      - name: Run advanced scientific analytic and GeoTIFF integration checks
        run: |
          GEOFATHOM_FIGURE_REVIEW_DIR=build/figure-review python -m pytest -q --junitxml=build/terrain-methods-tests.xml tests/test_terrain_scientific_methods.py tests/test_terrain_exact_coverage.py tests/test_terrain_uncertainty.py tests/test_terrain_mesh_streaming.py tests/test_terrain_independent_references.py tests/test_terrain_compiled_kernels.py tests/test_terrain_research.py tests/test_figure_library.py tests/test_figure_studio.py
      - name: Validate all spatial science methods against analytic references
        run: |
          GEOFATHOM_REQUIRE_SPATIAL_GDAL=1 python -m pytest -q --junitxml=build/spatial-science-tests.xml tests/test_spatial_science.py
          python scripts/spatial_science_gate.py --junit build/spatial-science-tests.xml --output build/spatial-science-acceptance.json
      - name: Enforce >=95 foundational synthetic numerical score for every Terrain operation
        run: |
          python scripts/terrain_numerical_gate.py --junit build/terrain-foundation-tests.xml --reference build/terrain-reference.json --output build/terrain-foundation-matrix.json
          python - <<'PY'
          import json
          data=json.load(open("build/terrain-foundation-matrix.json"))
          print(f"## foundational synthetic numerical acceptance: {data['operations_meeting_threshold']}/28 >=95",file=open("/tmp/terrain-summary","w"))
          print(f"Minimum benchmark score: {data['minimum_score']}/100")
          PY
      - name: Preserve numeric comparisons and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-scientific-reference
          path: |
            build/terrain-reference.json
            build/terrain-foundation-tests.xml
            build/terrain-foundation-matrix.json
            build/terrain-methods-tests.xml
            build/spatial-science-tests.xml
            build/spatial-science-acceptance.json
            build/figure-review/
          if-no-files-found: warn
          retention-days: 30
