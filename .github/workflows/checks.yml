name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build native geometry kernels
        run: |
          cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --config Release --parallel
          ctest --test-dir build/native --build-config Release --output-on-failure
      - name: Run Python tests with native library
        env:
          GEOFATHOM_REQUIRE_NATIVE: '1'
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        working-directory: web
        run: npm run build
