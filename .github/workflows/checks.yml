name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API and test dependencies
        run: python -m pip install -c requirements/linux.lock -e ".[dev,vision]" "onnx>=1.16,<2"
      - name: Build native geometry kernels
        run: |
          cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --config Release --parallel
          ctest --test-dir build/native --build-config Release --output-on-failure
          cmake -S . -B build/native-debug -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/native-debug --config Debug --parallel
          ctest --test-dir build/native-debug --build-config Debug --output-on-failure
      - name: Audit native address/undefined behavior
        run: |
          cmake -S . -B build/native-sanitized -DCMAKE_BUILD_TYPE=Debug -DGEOFATHOM_NATIVE_SANITIZERS=ON
          cmake --build build/native-sanitized --config Debug --parallel
          ctest --test-dir build/native-sanitized --build-config Debug --output-on-failure
      - name: Native thread sanitizer
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          cmake -S . -B build/native-tsan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread -no-pie" -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build/native-tsan --parallel
          TSAN_OPTIONS=halt_on_error=1 ctest --test-dir build/native-tsan --output-on-failure
      - name: Mutation fuzzing under ASan and UBSan
        run: |
          mkdir -p build/fuzz
          clang++ -std=c++17 -g -O1 -fno-omit-frame-pointer -fsanitize=fuzzer,address,undefined geometry/native/fuzz_spectral.cpp geometry/native/spectral.cpp geometry/native/transitions.cpp -o build/fuzz/spectral
          build/fuzz/spectral -runs=20000 -max_len=4096 -timeout=3
      - name: Run Python tests with native library
        env:
          GEOFATHOM_REQUIRE_NATIVE: '1'
          GEOFATHOM_STRESS_8K: '1'
          GEOFATHOM_STRESS_16K: '1'
          GEOFATHOM_STRESS_MILLION_SEGMENTS: '1'
          GEOFATHOM_REQUIRE_REAL_ONNX: '1'
        run: python scripts/run_acceptance.py -q --cov --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=json:coverage.json --junitxml=build/python-junit.xml
      - name: Native compute soak and performance smoke gate
        run: python benchmarks/soak.py --seconds 10 --output native-soak.json
      - name: Upload native soak result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-soak
          path: native-soak.json
      - name: Upload code coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geofathom-python-coverage
          path: |
            coverage.xml
            coverage.json
            build/python-junit.xml
          retention-days: 14

  native-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instrument GCC native CPU kernels
        run: |
          python -m pip install "gcovr>=8,<9"
          cmake -S . -B build/native-coverage -DCMAKE_BUILD_TYPE=Debug -DGEOFATHOM_NATIVE_COVERAGE=ON
          cmake --build build/native-coverage --parallel
          ctest --test-dir build/native-coverage --output-on-failure --no-tests=error
          gcovr --root . --filter geometry/native/ --exclude 'geometry/native/test_.*' --exclude 'geometry/native/fuzz_.*' --xml native-coverage.xml build/native-coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geofathom-native-coverage
          path: native-coverage.xml

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        working-directory: web
        run: npm run build
      - name: Unit test precision editor and survey geometry
        working-directory: web
        run: npm test
      - name: Collect frontend coverage using locked provider
        working-directory: web
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geofathom-web-coverage
          path: web/coverage/


  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GIS API
        run: python -m pip install -c requirements/linux.lock -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web and Playwright test dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Install Chromium and system dependencies
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Real browser UI integration tests
        working-directory: web
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: geofathom-browser-failure-traces
          path: web/test-results/
          retention-days: 7


  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Windows GIS and test dependencies
        run: python -m pip install -c requirements/windows.lock -e ".[dev]"
      - name: Compile native C++ kernels with MSVC
        run: |
          cmake -S . -B build/native -A x64
          cmake --build build/native --config Release --parallel
          ctest --test-dir build/native --build-config Release --output-on-failure
      - name: Execute Python tests using Windows DLL
        env:
          GEOFATHOM_REQUIRE_NATIVE: '1'
        run: python scripts/run_acceptance.py -q --cov --cov-branch --cov-report=xml:coverage.xml --cov-report=json:coverage.json --junitxml=build/windows-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geofathom-windows-coverage
          path: |
            coverage.xml
            coverage.json
            build/windows-junit.xml


  postgis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: geofathom
          POSTGRES_PASSWORD: geofathom_ci
          POSTGRES_DB: geofathom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geofathom -d geofathom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      GEOFATHOM_TEST_POSTGIS_DSN: postgresql://geofathom:geofathom_ci@localhost:5432/geofathom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PostGIS integration dependencies
        run: python -m pip install -c requirements/postgis.lock -e ".[dev,postgis]"
      - name: Test real PostGIS sync, GiST indexed query and revision
        run: python scripts/run_acceptance.py -v --cov --cov-branch --cov-report=xml:coverage.xml --cov-report=json:coverage.json --junitxml=postgis-junit.xml tests/test_postgis.py tests/test_distributed.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geofathom-postgis-coverage
          path: |
            coverage.xml
            coverage.json
            postgis-junit.xml
