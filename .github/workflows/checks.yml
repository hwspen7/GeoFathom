name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build native geometry kernels
        run: |
          cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --config Release --parallel
          ctest --test-dir build/native --build-config Release --output-on-failure
          cmake -S . -B build/native-debug -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/native-debug --config Debug --parallel
          ctest --test-dir build/native-debug --build-config Debug --output-on-failure
      - name: Run Python tests with native library
        env:
          GEOFATHOM_REQUIRE_NATIVE: '1'
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        working-directory: web
        run: npm run build
      - name: Unit test precision editor and survey geometry
        working-directory: web
        run: npm test


  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GIS API
        run: python -m pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web and Playwright test dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Install Chromium and system dependencies
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Real browser UI integration tests
        working-directory: web
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: geofathom-browser-failure-traces
          path: web/test-results/
          retention-days: 7


  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Windows GIS and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile native C++ kernels with MSVC
        run: |
          cmake -S . -B build/native -A x64
          cmake --build build/native --config Release --parallel
          ctest --test-dir build/native --build-config Release --output-on-failure
      - name: Execute Python tests using Windows DLL
        env:
          GEOFATHOM_REQUIRE_NATIVE: '1'
        run: python -m pytest -q
