name: Remote sensing scientific reference gate

on:
  push:
    branches: [main, develop, research-core, feature/remote-sensing-research]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  # Keep the newest PR revision; retain distinct main/develop and manual runs.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  remote-workbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked application dependencies
        run: |
          python -m pip install -c requirements/linux.lock -e ".[dev]"
          cd web
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify remote sensing build and browser workflow
        working-directory: web
        run: |
          npm run build
          npm test
          npx playwright test e2e/remote-sensing.spec.ts --workers=1
  remote-sensing-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent GDAL and locked scientific dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdal-bin
          python -m pip install -c requirements/linux.lock -e ".[dev]"
      - name: Compile Python scientific modules before numerical tests
        run: python -m compileall -q imagery analysis terrain jobs scripts tests
      - name: Verify numerical methods and full scientific workflows
        run: |
          mkdir -p build
          GEOFATHOM_REQUIRE_REMOTE_GDAL=1 python -m pytest -q --junitxml=build/remote-sensing-tests.xml tests/test_remote_sensing.py tests/test_remote_cog.py tests/test_remote_cube.py tests/test_remote_model.py tests/test_remote_model_validation.py tests/test_remote_reproducibility.py tests/test_remote_qa_support.py tests/test_remote_semantics.py tests/test_remote_harmonization.py tests/test_remote_confidence.py tests/test_remote_samples.py tests/test_remote_experiments.py tests/test_remote_benchmarks.py
          python scripts/remote_sensing_gate.py --junit build/remote-sensing-tests.xml --output build/remote-sensing-acceptance.json
      - name: Verify scientific figure catalog integration
        run: >-
          python -m pytest -q
          tests/test_figure_studio.py::test_catalog_count_and_unique_recipes
          tests/test_figure_studio.py::test_api_catalog_render_metadata_and_validation
          tests/test_figure_studio.py::test_domain_recipe_counts_and_tiers
          'tests/test_figure_studio.py::test_every_recipe_renders_actual_data[remote_selective_accuracy]'
      - name: Verify scene-scale bounded memory and exact raster arithmetic
        run: python scripts/remote_scene_scale.py --work build/scene-scale --output build/remote-scene-scale.json
      - name: Preserve numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-sensing-scientific-reference
          path: |
            build/remote-sensing-tests.xml
            build/remote-sensing-acceptance.json
            build/remote-scene-scale.json
          if-no-files-found: warn
          retention-days: 30
