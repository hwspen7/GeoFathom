name: Remote sensing real-scene reference

on:
  push:
    branches: [main, develop, feature/remote-sensing-research]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  # Keep the newest PR revision; retain distinct main/develop and manual runs.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  real-scene:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install -c requirements/linux.lock -e ".[dev]"
      - name: Verify public OSCD annotation transfer subset
        run: python scripts/remote_oscd_benchmark.py --cache build/oscd-cache --work build/oscd-work --output build/remote-oscd-reference.json
      - name: Verify pinned author-sourced native scene arithmetic
        run: python scripts/remote_scene_reference.py --oscd-native build/oscd-cache --output build/remote-scene-reference.json
      - name: Verify metadata-calibrated L2A dates and native QA pipeline
        run: python scripts/remote_stac_pipeline.py --cache build/stac-cache --work build/stac-work --output build/remote-stac-reference.json
      - name: Preserve real-scene evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-real-scene-evidence
          path: |
            build/remote-scene-reference.json
            build/remote-oscd-reference.json
            build/remote-stac-reference.json
          if-no-files-found: warn
          retention-days: 30
