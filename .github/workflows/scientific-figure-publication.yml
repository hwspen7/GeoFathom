name: Scientific figure publication
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -c requirements/linux.lock -e ".[dev]"
      - run: python -m pytest -q tests/test_studio_publication_research.py --junitxml=publication-reference.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-reference
          path: publication-reference.xml
